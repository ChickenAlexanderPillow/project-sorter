server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex on;
    default_type application/octet-stream;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
