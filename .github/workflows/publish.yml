name: Publish Pepper release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Set automatic build version
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $parts = $config.version.Split('.')
          $config.version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          $json = $config | ConvertTo-Json -Depth 20
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $configPath), $json, $utf8NoBom)
          "APP_VERSION=$($config.version)" >> $env:GITHUB_ENV

      - name: Normalize updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $key = $env:TAURI_SIGNING_PRIVATE_KEY_RAW -replace '\s', ''
          "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW" >> $env:GITHUB_ENV

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Pepper v__VERSION__
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          args: "--bundles msi"

      - name: Use direct release URLs for updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:APP_VERSION"
          $manifestDir = Join-Path $env:RUNNER_TEMP "pepper-updater-manifest"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          gh release download $tag --pattern latest.json --dir $manifestDir

          $manifestPath = Join-Path $manifestDir "latest.json"
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $assetUrls = @{}
          foreach ($asset in $release.assets) {
            $assetUrls[$asset.url] = $asset.browser_download_url
          }

          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $directUrl = $assetUrls[$platform.Value.url]
            if (-not $directUrl) {
              throw "Could not resolve a direct download URL for $($platform.Name)"
            }
            $platform.Value.url = $directUrl
          }

          $json = $manifest | ConvertTo-Json -Depth 20
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($manifestPath, $json, $utf8NoBom)
          gh release upload $tag $manifestPath --clobber
